name: stat-interview-ai tests
on:
  pull_request:
    paths: ["stat-interview-ai/**", ".github/workflows/stat-interview-tests.yml"]
  push:
    branches: [master]
    paths: ["stat-interview-ai/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python3 stat-interview-ai/tests/phase0_smoke.py
      - run: python3 stat-interview-ai/tests/codelab_check.py
